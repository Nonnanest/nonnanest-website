<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nonnanest 'n' mark — soft nest arc + wordmark-derived 'n' letterform.
       Pure geometry, no font dependency — reproducible at any size. -->
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Deep teal background -->
    <rect width="512" height="512" fill="#3D6B6D"/>
    <!-- Soft teal nest curve underline -->
    <path d="M 68 400 Q 256 340 444 400" stroke="#559092" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- Warm-white 'n' — condensed geometric, evokes Oswald without being it -->
    <!-- left stem -->
    <rect x="140" y="150" width="52" height="230" rx="6" fill="#FAF8F5"/>
    <!-- arch: right stem -->
    <rect x="320" y="222" width="52" height="158" rx="6" fill="#FAF8F5"/>
    <!-- arch curve connecting the two -->
    <path d="M 140 226 Q 140 150 216 150 L 300 150 Q 372 150 372 226 L 372 244 L 320 244 L 320 226 Q 320 202 296 202 L 216 202 Q 192 202 192 226 L 192 244 L 140 244 Z" fill="#FAF8F5"/>
  </g>
</svg>
